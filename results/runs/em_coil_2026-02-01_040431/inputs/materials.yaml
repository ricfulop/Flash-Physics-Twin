# PFR Materials Properties (v1.0-minimal)
# Material definitions for reactor and sample

gas:
  species: ["H2", "H", "H2O"]
  H2:
    molar_mass: 2.016e-3     # [kg/mol]
    viscosity_model: "sutherland"
    thermal_conductivity_model: "kinetic"
  
walls:
  material: "quartz"
  thermal_conductivity: 1.4  # [W/(m·K)]
  emissivity: 0.9

sample:
  # Generic metal oxide (MO) properties
  oxide:
    name: "FeO"              # placeholder
    molar_mass: 71.85e-3     # [kg/mol]
    density: 5700.0          # [kg/m³]
    thermal_conductivity: 3.0  # [W/(m·K)]
    specific_heat: 650.0     # [J/(kg·K)]
  
  metal:
    name: "Fe"
    molar_mass: 55.85e-3     # [kg/mol]
    density: 7870.0          # [kg/m³]

  # Flash parameters
  flash:
    DeltaB_ref: 50000.0      # [J/mol] reference activation barrier
    chi_threshold: 0.3       # [-] percolation threshold
    chi_width: 0.1           # [-] transition smoothing width
