# PFR Operating Conditions (v1.0-minimal)
# Baseline operating parameters

pressure:
  total: 1000.0        # [Pa] total pressure (~10 mbar)

flow:
  H2_inlet: 5.0e-5     # [kg/s] H2 mass flow rate
  inlet_temperature: 300.0  # [K] inlet gas temperature

rf_power:
  forward: 5000.0      # [W] RF forward power
  frequency: 13560000.0  # [Hz] RF frequency (13.56 MHz)

bias:
  voltage: -200.0      # [V] DC bias voltage
  enabled: true

thermal:
  wall_temperature: 400.0   # [K] wall temperature (if fixed)
  wall_bc_type: "fixed"     # "fixed" or "convective"

plasma:
  ne_initial: 1.0e17   # [m^-3] initial electron density estimate
  Te_initial: 10000.0  # [K] initial electron temperature (~1 eV)

time:
  mode: "steady"       # "steady" or "transient"
  end_time: null       # [s] for transient only

# ============================================================================
# EM Coupling Configuration
# ============================================================================
em:
  mode: "surrogate"    # "surrogate" or "comsol"
                       # - surrogate: compute Q_RF internally using analytical model
                       # - comsol: load Q_RF from COMSOL AC/DC export (future)
  
  # Surrogate model parameters (used when em_mode=surrogate)
  surrogate:
    I_coil: 10.0         # [A] coil current amplitude
    sigma_eff: 0.01      # [S/m] effective plasma conductivity
    calibration:
      B_measured: null   # [T] measured B-field at calibration point (optional)
      r_cal: 0.025       # [m] calibration point radius
      z_cal: 0.1         # [m] calibration point z-position
  
  # RF-to-Flash coupling
  rf_coupling:
    gamma_RF: 0.2        # [dimensionless] RF-to-Flash coupling efficiency
                         # E_eff = E_bias + gamma_RF * E_RF_induced
                         # gamma_RF=0 means DC-only activation
                         # gamma_RF=1 means full RF contribution
    lambda_onset: 60443.0  # [V/m] onset electric field from PhysicsNeMo inversion

# ============================================================================
# Powder Fall Region Definition
# ============================================================================
# The powder falls through a specific region of the reactor where activation
# is most critical. KPIs should be computed specifically for this region.

powder_region:
  # Radial bounds (relative to tube center)
  # Powder falls in an annular region between r_min and r_max
  r_min: 0.005         # [m] inner radius of powder fall region (5mm from centerline)
  r_max: 0.035         # [m] outer radius of powder fall region (35mm from centerline)
  
  # Axial bounds
  # Powder is in the reactor from z_start to z_end
  z_start: 0.06        # [m] start of powder fall zone (60mm from inlet)
  z_end: 0.14          # [m] end of powder fall zone (140mm from inlet)
  
  # Residence time and exposure
  fall_velocity: 0.5   # [m/s] approximate powder fall velocity
  residence_time: 0.16 # [s] time powder spends in active region = (z_end - z_start) / fall_velocity

# ============================================================================
# Coil Geometry (for EM optimization)
# ============================================================================
coil:
  n_turns: 8           # number of turns
  inner_radius: 0.055  # [m] coil inner radius (55mm)
  wire_diameter: 0.006 # [m] copper wire diameter (6mm)
  z_start: 0.04        # [m] coil start position
  z_end: 0.16          # [m] coil end position
  pitch: 0.015         # [m] turn-to-turn spacing
